name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  # Fast feedback first — catches most mistakes in under a minute, before
  # the much slower e2e job (which needs a database, a full build, and a
  # browser) even starts.
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Only needs the schema file + network access to generate types —
      # no live database required for this step.
      - run: npx prisma generate

      - run: npm run typecheck
      - run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aurora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aurora_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/aurora_test?schema=public
      # A throwaway secret scoped to this ephemeral CI database — never
      # the same value as any real environment's AUTH_SECRET.
      AUTH_SECRET: ci-only-throwaway-secret-do-not-reuse-anywhere-else
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NODE_ENV: production
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      CI: "true"
      # Deliberately unset: STRIPE_SECRET_KEY, RESEND_API_KEY,
      # UPSTASH_REDIS_REST_URL/TOKEN. The checkout test explicitly
      # accepts either a real Stripe redirect or the graceful
      # "not configured" error (see tests/e2e/cart-checkout.spec.ts) —
      # CI verifies the honest-degradation path actually works, rather
      # than needing real third-party credentials just to run the suite.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # NODE_ENV=production (set above for the build) makes npm skip
      # devDependencies by default — but the build needs typescript (to
      # resolve the @/ path aliases in tsconfig.json), autoprefixer, etc.
      - run: npm ci --include=dev

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed test data
        run: npx prisma db seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # A real production build, not `next dev` — this is what
      # playwright.config.ts's CI branch expects (fullyParallel: true,
      # workers: unset), since `next dev`'s on-demand compilation is what
      # caused flaky timeouts when this was first tested locally in
      # parallel. Product pages use generateStaticParams, so the seeded
      # data above has to exist before this step, not just before tests.
      - name: Build
        run: npm run build

      - name: Start production server
        run: npm run start > server.log 2>&1 &

      - name: Wait for server
        run: timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 1; done'

      - name: Run Playwright tests
        run: npm run test

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
